server:
  port: 8282

spring:
  application:
    name: chat-service
  ai:
    ollama:
      init:
        pull-model-strategy: when-missing
      chat:
        model: qwen3.5:4b
      embedding:
        model: granite-embedding:278m
    vectorstore:
      pgvector:
        dimensions: 768
        index-type: hnsw
        initialize-schema: true
  threads:
    virtual:
      enabled: true

management:
  metrics:
    distribution:
      percentiles-histogram:
        all: true
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      show-components: always

arconia:
  multitenancy:
    details:
      tenants:
        - identifier: dukes
        - identifier: beans
        - identifier: trixie
          enabled: false
