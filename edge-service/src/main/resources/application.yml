server:
  port: 80

spring:
  application:
    name: edge-service
  
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: instrument-route
              uri: http://localhost:8181
              predicates:
                - Host=*.rock
                - Path=/instruments/**
              filters:
                - TokenRelay=
                - PropagateTenant=

  threads:
    virtual:
      enabled: true

management:
  metrics:
    distribution:
      percentiles-histogram:
        all: true
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      show-components: always

arconia:
  multitenancy:
    details:
      tenants:
        - identifier: dukes
          attributes:
            client-id: edge-service
            client-secret: rocking-secret
            issuer-uri: http://localhost:8080/realms/dukes
        - identifier: beans
          attributes:
            client-id: edge-service
            client-secret: rocking-secret
            issuer-uri: http://localhost:8080/realms/beans
        - identifier: trixie
          enabled: false
    resolution:
      http:
        resolution-mode: subdomain
        subdomain:
          pattern: "{tenant}.rock"
