server:
  port: 8181

spring:
  application:
    name: instrument-service
  flyway:
    locations: classpath:db/migration/default
    schemas: default
  threads:
    virtual:
      enabled: true

management:
  metrics:
    distribution:
      percentiles-histogram:
        all: true
        http.server.requests: true
  endpoint:
    health:
      show-details: always
      show-components: always

arconia:
  multitenancy:
    details:
      tenants:
        - identifier: dukes
          attributes:
            issuer-uri: http://localhost:8080/realms/dukes
            schema: DUKES
        - identifier: beans
          attributes:
            issuer-uri: http://localhost:8080/realms/beans
            schema: BEANS
        - identifier: trixie
          enabled: false
    resolution:
      http:
        resolution-mode: header
